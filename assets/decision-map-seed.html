<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decision Map Seed</title>
  <style>
    :root {
      --paper: #fafaf8;
      --ink: #0a0a0a;
      --grey-1: #f0f0ee;
      --grey-2: #d4d4d2;
      --grey-3: #737373;
      --accent: #002FA7;
      --accent-on: #ffffff;
      --line: rgba(10, 10, 10, 0.14);
      --mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace;
      --sans: Inter, "Helvetica Neue", Helvetica, "Noto Sans SC", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr) minmax(260px, 360px);
      min-height: 100vh;
      border-top: 1px solid var(--ink);
    }

    .panel {
      min-width: 0;
      border-right: 1px solid var(--line);
      padding: 16px;
      overflow: auto;
    }

    .panel.right { border-right: 0; border-left: 1px solid var(--line); }

    .map-stage {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(250, 250, 248, 0.94);
      backdrop-filter: blur(8px);
    }

    button, select, input {
      min-height: 32px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: var(--paper);
      color: var(--ink);
      font: 500 12px var(--mono);
      text-transform: uppercase;
    }

    button[aria-pressed="true"], .is-active {
      background: var(--accent);
      color: var(--accent-on);
      border-color: var(--accent);
    }

    .canvas {
      position: relative;
      min-width: 960px;
      min-height: 680px;
      transform-origin: 0 0;
    }

    .node {
      position: absolute;
      width: 180px;
      min-height: 92px;
      padding: 12px;
      border: 1px solid var(--ink);
      background: var(--paper);
      cursor: pointer;
    }

    .node[aria-selected="true"] {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .node-title {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.18;
      font-weight: 650;
    }

    .node-meta {
      font: 500 10px var(--mono);
      color: var(--grey-3);
      text-transform: uppercase;
    }

    svg.edges {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .edge-path {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.4;
      pointer-events: stroke;
      cursor: pointer;
    }

    .edge-path.secondary { stroke: var(--grey-3); stroke-dasharray: 4 5; }
    .edge-path.hidden { display: none; pointer-events: none; }
    .edge-path.selected { stroke: var(--accent); stroke-width: 2.5; }

    .kicker {
      margin: 0 0 8px;
      font: 600 11px var(--mono);
      text-transform: uppercase;
      color: var(--accent);
    }

    h1, h2, h3 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 30px; line-height: 0.95; font-weight: 300; }
    h2 { font-size: 18px; line-height: 1.1; font-weight: 600; }
    p { line-height: 1.45; }

    @media (max-width: 860px) {
      .app-shell { grid-template-columns: 1fr; }
      .panel, .panel.right { border: 0; border-bottom: 1px solid var(--line); max-height: 36vh; }
      .canvas { min-width: 760px; }
    }
  </style>
</head>
<body>
  <div class="app-shell" data-map-shell>
    <aside class="panel" data-left-panel>
      <p class="kicker">Decision Map</p>
      <h1 data-map-title>Replace With Map Title</h1>
      <div data-filters></div>
    </aside>

    <main class="map-stage">
      <div class="toolbar" data-toolbar>
        <button type="button" data-action="fit">Fit</button>
        <button type="button" data-action="zoom-in">+</button>
        <button type="button" data-action="zoom-out">-</button>
        <button type="button" data-action="reset">Reset</button>
        <button type="button" data-edge-mode="spine" aria-pressed="true">Spine</button>
        <button type="button" data-edge-mode="focus">Focus</button>
        <button type="button" data-edge-mode="all">All</button>
        <button type="button" data-action="export">Export JSON</button>
      </div>
      <section class="canvas" data-canvas>
        <svg class="edges" data-edges aria-hidden="true"></svg>
        <div data-nodes></div>
      </section>
    </main>

    <aside class="panel right" data-detail-panel>
      <p class="kicker">Selection</p>
      <h2 data-detail-title>No node selected</h2>
      <div data-detail-body></div>
    </aside>
  </div>

  <script>
    const storageKey = "decision-map-seed-state";

    function loadTeamState() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || "{}");
      } catch (error) {
        window.__decisionMapStorageError = String(error);
        return {};
      }
    }

    function saveTeamState(nextState) {
      try {
        localStorage.setItem(storageKey, JSON.stringify(nextState));
        return true;
      } catch (error) {
        return false;
      }
    }

    const teamState = loadTeamState();

    // Replace this model. Keep the canonical shape: meta, nodes, edges,
    // decisions, reviews. Add stages/lanes/sources when the grammar needs them.
    const model = {
      meta: {
        title: "Decision Map Seed",
        generatedAt: "2026-06-24",
        version: 1,
        mapGrammar: "dependency-graph",
        sourceNotes: []
      },
      nodes: [],
      edges: [],
      decisions: [],
      reviews: [],
      teamState
    };
  </script>
</body>
</html>
