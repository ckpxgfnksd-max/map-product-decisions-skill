<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Content Learning Loop</title>
  <style>
    :root {
      --paper:#fafaf8; --ink:#0a0a0a; --grey-1:#f0f0ee; --grey-2:#d4d4d2;
      --grey-3:#666; --accent:#002fa7; --accent-on:#fff; --danger:#a32222;
      --line:rgba(10,10,10,.16); --mono:"IBM Plex Mono","JetBrains Mono",ui-monospace,monospace;
      --sans:Inter,"Helvetica Neue",Helvetica,"Noto Sans SC",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans)}
    button,input,select,textarea{font:inherit;color:inherit}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .app-shell{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr) minmax(280px,360px);height:100vh;border-top:1px solid var(--ink)}
    .app-shell.left-collapsed{grid-template-columns:0 minmax(0,1fr) minmax(280px,360px)}
    .app-shell.right-collapsed{grid-template-columns:minmax(220px,280px) minmax(0,1fr) 0}
    .app-shell.left-collapsed.right-collapsed{grid-template-columns:0 minmax(0,1fr) 0}
    .panel{min-width:0;padding:16px;overflow:auto;border-right:1px solid var(--line);background:var(--paper)}
    .panel.right{border-right:0;border-left:1px solid var(--line)}
    .left-collapsed [data-left-panel],.right-collapsed [data-detail-panel]{visibility:hidden;padding:0;overflow:hidden;border:0}
    .kicker,.meta,.eyebrow{font:600 10px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--grey-3)}
    .kicker{color:var(--accent);margin:0 0 9px}
    h1,h2,h3,h4,p{margin-top:0}
    h1{font-size:30px;line-height:.96;font-weight:320;margin-bottom:16px}
    h2{font-size:20px;line-height:1.08}
    h3{margin:24px 0 10px;font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
    p{font-size:13px;line-height:1.5}
    .question{padding:12px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font-weight:650}
    .search{width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--ink);border-radius:0;background:var(--paper)}
    .filter-row,.relation-button,.decision-button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:12px}
    .filter-row input{accent-color:var(--accent)}
    .decision-button,.relation-button{cursor:pointer}
    .decision-button:hover,.relation-button:hover{color:var(--accent)}
    .map-stage{position:relative;min-width:0;overflow:auto;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
    .toolbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:9px;border-bottom:1px solid var(--line);background:rgba(250,250,248,.96);backdrop-filter:blur(8px)}
    .toolbar button,.toolbar label{min-height:34px;padding:7px 9px;border:1px solid var(--ink);border-radius:0;background:var(--paper);font:600 10px var(--mono);text-transform:uppercase;cursor:pointer}
    .toolbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
    .toolbar .spacer{flex:1}
    .toolbar-status{flex-basis:100%;min-height:15px;font:500 10px var(--mono);color:var(--grey-3)}
    .canvas-viewport{min-width:0;min-height:calc(100vh - 70px);overflow:auto}
    .canvas{position:relative;width:1120px;height:720px;transform-origin:0 0}
    .node{position:absolute;width:188px;height:112px;padding:12px;border:1px solid var(--ink);border-radius:0;background:var(--paper);text-align:left;cursor:pointer;overflow:hidden}
    .node:hover{border-color:var(--accent)}
    .node[aria-selected="true"]{outline:3px solid var(--accent);outline-offset:2px}
    .node.is-muted{opacity:.26}
    .node-title{display:block;margin:6px 0 8px;font-size:16px;line-height:1.08;font-weight:680}
    .node-meta{display:flex;justify-content:space-between;gap:6px;font:600 9px var(--mono);text-transform:uppercase;color:var(--grey-3)}
    .priority-now{border-top:5px solid var(--accent)}
    svg.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
    .edge-path{fill:none;stroke:var(--ink);stroke-width:1.5;pointer-events:stroke}
    .edge-path.secondary{stroke:var(--grey-3);stroke-dasharray:5 5}
    .edge-path.selected{stroke:var(--accent);stroke-width:3}
    .edge-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
    .edge-group.hidden{display:none;pointer-events:none}
    .edge-label{font:600 9px var(--mono);fill:var(--accent);paint-order:stroke;stroke:var(--paper);stroke-width:4px}
    .detail-section{padding:14px 0;border-top:1px solid var(--line)}
    .detail-section h3{margin:0 0 7px}
    .detail-list{margin:0;padding-left:18px;font-size:12px;line-height:1.5}
    .field{display:grid;gap:5px;margin:10px 0;font:600 10px var(--mono);text-transform:uppercase;color:var(--grey-3)}
    .field select,.field textarea{width:100%;border:1px solid var(--ink);border-radius:0;background:var(--paper);padding:8px;color:var(--ink);font:400 13px var(--sans);text-transform:none}
    .field textarea{min-height:92px;resize:vertical}
    .badge{display:inline-block;padding:2px 5px;border:1px solid var(--ink);font:600 9px var(--mono);text-transform:uppercase}
    .badge.high{border-color:var(--danger);color:var(--danger)}
    .empty{color:var(--grey-3)}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    @media (max-width:900px){
      .app-shell,.app-shell.left-collapsed,.app-shell.right-collapsed,.app-shell.left-collapsed.right-collapsed{display:block;height:auto}
      .panel,.panel.right{border:0;border-bottom:1px solid var(--line);max-height:42vh;overflow:auto}
      .left-collapsed [data-left-panel],.right-collapsed [data-detail-panel]{display:none}
      .map-stage{min-height:70vh}.canvas-viewport{min-height:640px}.toolbar .spacer{display:none}
    }
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app-shell" data-map-shell>
    <aside class="panel" data-left-panel id="left-panel">
      <p class="kicker">Decision map</p>
      <h1 data-map-title></h1>
      <p class="question" data-decision-question></p>
      <h3>Search</h3>
      <input class="search" type="search" data-search placeholder="Find a node" aria-label="Search nodes">
      <h3>Layers</h3>
      <div data-filters></div>
      <h3>Decision queue</h3>
      <div data-decisions></div>
      <h3>Relations</h3>
      <div data-relations-list></div>
      <h3>Reviews</h3>
      <div data-reviews></div>
    </aside>

    <main class="map-stage">
      <div class="toolbar" role="toolbar" aria-label="Map controls">
        <button type="button" data-action="collapse-left" aria-expanded="true" aria-controls="left-panel">Filters</button>
        <button type="button" data-action="collapse-right" aria-expanded="true" aria-controls="detail-panel">Details</button>
        <button type="button" data-action="fit">Fit</button>
        <button type="button" data-action="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" data-action="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" data-action="reset">100%</button>
        <button type="button" data-edge-mode="overview" aria-pressed="true">Overview</button>
        <button type="button" data-edge-mode="focus" aria-pressed="false">Focus</button>
        <button type="button" data-edge-mode="all" aria-pressed="false">All</button>
        <span class="spacer"></span>
        <button type="button" data-action="import">Import JSON</button>
        <button type="button" data-action="export">Export JSON</button>
        <button type="button" data-action="clear-state">Clear personal draft</button>
        <input class="sr-only" type="file" accept="application/json" data-import-input>
        <div class="toolbar-status" data-status aria-live="polite"></div>
      </div>
      <div class="canvas-viewport" data-canvas-viewport>
        <section class="canvas" data-canvas role="graphics-document document" aria-label="Interactive product decision map">
          <svg class="edges" data-edges aria-hidden="true">
            <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path></marker></defs>
          </svg>
          <div data-nodes></div>
        </section>
      </div>
    </main>

    <aside class="panel right" data-detail-panel id="detail-panel">
      <p class="kicker">Overview</p>
      <h2 data-detail-title>Select a node or relation</h2>
      <div data-detail-body></div>
    </aside>
  </div>

  <script>
    const model = JSON.parse(document.getElementById("decision-map-model").textContent);
    const storageKey = `decision-map:${model.meta.title.toLowerCase().replace(/[^a-z0-9]+/g,"-")}:personal-v${model.meta.schemaVersion}`;
    const defaultState = { notes:{}, priorities:{}, decisionStatuses:{}, events:[] };
    let teamState = loadPersonalDraft();
    let selected = null;
    let edgeMode = "overview";
    let zoom = 1;
    let searchTerm = "";
    const activeLayers = new Set(model.nodes.map(node => node.layer));

    const shell = document.querySelector("[data-map-shell]");
    const canvas = document.querySelector("[data-canvas]");
    const viewport = document.querySelector("[data-canvas-viewport]");
    const edgesSvg = document.querySelector("[data-edges]");
    const nodesRoot = document.querySelector("[data-nodes]");
    const detailTitle = document.querySelector("[data-detail-title]");
    const detailBody = document.querySelector("[data-detail-body]");
    const status = document.querySelector("[data-status]");

    function escapeHtml(value){
      return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    }
    function escapeAttr(value){return escapeHtml(value).replace(/`/g,"&#96;")}
    function safeClass(value){return String(value??"").toLowerCase().replace(/[^a-z0-9_-]+/g,"-")}
    function safeNumber(value,fallback=0){return Number.isFinite(value)?value:fallback}

    function loadPersonalDraft(){
      try{
        const draft={...structuredClone(defaultState),...JSON.parse(localStorage.getItem(storageKey)||"{}")};
        for(const [decisionId,value] of Object.entries(draft.decisionStatuses||{})){
          if(value==="accepted"&&model.decisions.find(item=>item.id===decisionId)?.status!=="accepted")delete draft.decisionStatuses[decisionId];
        }
        return draft;
      }
      catch(error){window.__decisionMapStorageError=String(error);return structuredClone(defaultState)}
    }
    function savePersonalDraft(){
      try{localStorage.setItem(storageKey,JSON.stringify(teamState));return true}
      catch(error){status.textContent="Personal draft could not be saved. Export JSON to preserve it.";return false}
    }
    function appendEvent(kind,targetId,value){
      teamState.events.push({eventId:`evt-${Date.now()}-${Math.random().toString(16).slice(2)}`,actor:"local-user",timestamp:new Date().toISOString(),kind,targetId,value});
      savePersonalDraft();
    }
    function draftEventError(event){
      if(!event||typeof event!=="object"||Array.isArray(event))return "event must be an object";
      for(const field of ["eventId","actor","timestamp","kind","targetId"]){if(typeof event[field]!=="string"||!event[field].trim())return `${field} must be a non-empty string`}
      if(!["note","priority","decision-status"].includes(event.kind))return `unknown event kind: ${event.kind}`;
      if(Number.isNaN(Date.parse(event.timestamp)))return `invalid event timestamp: ${event.eventId}`;
      const allowed=event.kind==="decision-status"?model.decisions:model.nodes;
      if(!allowed.some(item=>item.id===event.targetId))return `unknown event target: ${event.targetId}`;
      if(event.kind==="decision-status"&&event.value==="accepted"&&model.decisions.find(item=>item.id===event.targetId)?.status!=="accepted")return `acceptance requires canonical model update: ${event.targetId}`;
      return null;
    }
    function visibleNodes(){
      return model.nodes.filter(node=>activeLayers.has(node.layer)&&`${node.title} ${node.summary} ${node.owner}`.toLowerCase().includes(searchTerm));
    }
    function reconcileSelection(){
      if(selected?.kind==="node"&&!visibleNodes().some(node=>node.id===selected.id)) selected=null;
      if(selected?.kind==="edge"){
        const edge=model.edges.find(item=>item.id===selected.id);const ids=new Set(visibleNodes().map(node=>node.id));
        if(!edge||!ids.has(edge.from)||!ids.has(edge.to)||(edgeMode==="overview"&&edge.primary===false)) selected=null;
      }
    }
    function edgeVisible(edge){
      const ids=new Set(visibleNodes().map(node=>node.id));
      if(!ids.has(edge.from)||!ids.has(edge.to)) return false;
      if(edgeMode==="all") return true;
      if(edgeMode==="focus") return edge.primary!==false||selected?.id===edge.id||selected?.id===edge.from||selected?.id===edge.to;
      return edge.primary!==false;
    }
    function renderFilters(){
      const counts=Object.groupBy(model.nodes,node=>node.layer);
      document.querySelector("[data-filters]").innerHTML=Object.entries(counts).map(([layer,nodes])=>`<label class="filter-row"><span><input type="checkbox" data-layer="${escapeAttr(layer)}" ${activeLayers.has(layer)?"checked":""}> ${escapeHtml(layer)}</span><span class="meta">${nodes.length}</span></label>`).join("");
    }
    function renderNodes(){
      const visible=new Set(visibleNodes().map(node=>node.id));
      nodesRoot.innerHTML=model.nodes.map(node=>`<button type="button" class="node priority-${safeClass(teamState.priorities[node.id]||node.priority)} ${visible.has(node.id)?"":"is-muted"}" style="left:${safeNumber(node.x)}px;top:${safeNumber(node.y)}px" data-node-id="${escapeAttr(node.id)}" aria-selected="${selected?.kind==="node"&&selected.id===node.id}" ${visible.has(node.id)?"":"hidden"}><span class="eyebrow">${escapeHtml(node.layer)} · ${escapeHtml(node.maturity)}</span><span class="node-title">${escapeHtml(node.title)}</span><span class="node-meta"><span>${escapeHtml(teamState.priorities[node.id]||node.priority)}</span><span>${escapeHtml(node.owner)}</span></span></button>`).join("");
    }
    function edgePath(edge){
      const from=model.nodes.find(node=>node.id===edge.from);const to=model.nodes.find(node=>node.id===edge.to);
      const x1=safeNumber(from.x)+188,y1=safeNumber(from.y)+56,x2=safeNumber(to.x),y2=safeNumber(to.y)+56,dx=Math.max(70,Math.abs(x2-x1)*.45);
      return `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
    }
    function renderEdges(){
      const defs=edgesSvg.querySelector("defs").outerHTML;
      edgesSvg.innerHTML=defs+model.edges.map(edge=>{
        const hidden=!edgeVisible(edge),path=edgePath(edge),from=model.nodes.find(node=>node.id===edge.from),to=model.nodes.find(node=>node.id===edge.to),mx=(safeNumber(from.x)+188+safeNumber(to.x))/2,my=(safeNumber(from.y)+safeNumber(to.y))/2+56;
        const selectedEdge=selected?.kind==="edge"&&selected.id===edge.id;
        return `<g class="edge-group ${hidden?"hidden":""}" data-edge-id="${escapeAttr(edge.id)}"><path class="edge-path ${edge.primary===false?"secondary":""} ${selectedEdge?"selected":""}" d="${path}" marker-end="url(#arrow)"></path><path class="edge-hit" d="${path}" data-edge-hit="${escapeAttr(edge.id)}"></path>${selectedEdge?`<text class="edge-label" x="${mx}" y="${my}">${escapeHtml(edge.label)}</text>`:""}</g>`;
      }).join("");
    }
    function renderRelations(){
      document.querySelector("[data-relations-list]").innerHTML=model.edges.filter(edgeVisible).map(edge=>`<button class="relation-button" type="button" data-relation-id="${escapeAttr(edge.id)}"><span>${escapeHtml(model.nodes.find(n=>n.id===edge.from).title)} → ${escapeHtml(model.nodes.find(n=>n.id===edge.to).title)}</span><span class="meta">${escapeHtml(edge.type)}</span></button>`).join("")||'<p class="empty">No visible relations.</p>';
    }
    function renderDecisions(){
      document.querySelector("[data-decisions]").innerHTML=model.decisions.map(decision=>`<button class="decision-button" type="button" data-decision-id="${escapeAttr(decision.id)}"><span>${escapeHtml(decision.title)}</span><span class="badge">${escapeHtml(teamState.decisionStatuses[decision.id]||decision.status)}</span></button>`).join("");
    }
    function renderReviews(){
      document.querySelector("[data-reviews]").innerHTML=model.reviews.map(review=>`<button class="decision-button" type="button" data-review-id="${escapeAttr(review.id)}"><span>${escapeHtml(review.area)}</span><span class="badge ${safeClass(review.severity)}">${escapeHtml(review.severity)}</span></button>`).join("");
    }
    function list(title,items){return `<section class="detail-section"><h3>${escapeHtml(title)}</h3>${items?.length?`<ul class="detail-list">${items.map(item=>`<li>${escapeHtml(item)}</li>`).join("")}</ul>`:'<p class="empty">None recorded.</p>'}</section>`}
    function renderDetail(){
      if(!selected){
        detailTitle.textContent=model.meta.decisionQuestion;
        detailBody.innerHTML=`<p>${escapeHtml(model.meta.audience)} · ${escapeHtml(model.meta.decisionHorizon)}</p><section class="detail-section"><h3>How to use this map</h3><p>Start in Overview. Select a node to reveal its direct impact chain, then inspect a relation to see what changes if it is removed.</p></section>`;
        return;
      }
      if(selected.kind==="node"){
        const node=model.nodes.find(item=>item.id===selected.id);detailTitle.textContent=node.title;
        const incoming=model.edges.filter(edge=>edge.to===node.id).map(edge=>`${edge.type}: ${model.nodes.find(n=>n.id===edge.from).title}`);
        const outgoing=model.edges.filter(edge=>edge.from===node.id).map(edge=>`${edge.type}: ${model.nodes.find(n=>n.id===edge.to).title}`);
        detailBody.innerHTML=`<p>${escapeHtml(node.summary)}</p><p class="meta">Owner ${escapeHtml(node.owner)} · ${escapeHtml(node.layer)} · ${escapeHtml(node.maturity)}</p><label class="field">Personal priority<select data-edit-priority><option>now</option><option>next</option><option>later</option><option>monitor</option><option>reject</option></select></label><label class="field">Personal note<textarea data-edit-note placeholder="This stays in this browser until exported."></textarea></label>${list("Decisions",node.decisions)}${list("Risks",node.risks)}${list("Open questions",node.openQuestions)}${list("Incoming",incoming)}${list("Downstream",outgoing)}${list("Interfaces",node.interfaces)}`;
        const priority=detailBody.querySelector("[data-edit-priority]");priority.value=teamState.priorities[node.id]||node.priority;
        const note=detailBody.querySelector("[data-edit-note]");note.value=teamState.notes[node.id]||"";
      }else if(selected.kind==="edge"){
        const edge=model.edges.find(item=>item.id===selected.id);detailTitle.textContent=edge.label;
        detailBody.innerHTML=`<p><span class="badge">${escapeHtml(edge.type)}</span> ${escapeHtml(model.nodes.find(n=>n.id===edge.from).title)} → ${escapeHtml(model.nodes.find(n=>n.id===edge.to).title)}</p>${list("Impact",[edge.impact])}${list("If removed",[edge.ifRemoved])}`;
      }else if(selected.kind==="decision"){
        const decision=model.decisions.find(item=>item.id===selected.id);const canonicalAccepted=decision.status==="accepted";const current=canonicalAccepted?"accepted":(teamState.decisionStatuses[decision.id]||decision.status);detailTitle.textContent=decision.title;
        const statusOptions=canonicalAccepted?'<option value="accepted">accepted</option>':'<option value="proposed">proposed</option><option value="needs-review">needs-review</option><option value="rejected">rejected</option><option value="blocked">blocked</option>';
        detailBody.innerHTML=`<p>${escapeHtml(decision.context)}</p><p class="meta">Reversibility ${escapeHtml(decision.reversibility)} · Confidence ${escapeHtml(decision.confidence)}</p><label class="field">Personal review state<select data-edit-decision ${canonicalAccepted?"disabled":""}>${statusOptions}</select></label>${canonicalAccepted?'<p>Accepted records are append-only. Create a superseding proposal instead of rewriting history.</p>':'<p>Acceptance is team-owned. Record decidedAt, approvers, and consequences in the versioned canonical model.</p>'}${list("Options",decision.options)}${list("Rationale",[decision.rationale])}${list("Trade-offs",decision.tradeoffs)}${list("Consequences",decision.consequences)}${list("Acceptance criteria",decision.acceptanceCriteria)}${list("Rollback",[decision.rollbackPlan])}`;
        detailBody.querySelector("[data-edit-decision]").value=current;
      }else{
        const review=model.reviews.find(item=>item.id===selected.id);detailTitle.textContent=`${review.area} review`;
        detailBody.innerHTML=`<p><span class="badge ${safeClass(review.severity)}">${escapeHtml(review.severity)}</span></p>${list("Finding",[review.finding])}${list("Linked nodes",review.linkedNodes.map(id=>model.nodes.find(node=>node.id===id)?.title||id))}`;
      }
    }
    function render(){
      reconcileSelection();renderFilters();renderNodes();renderEdges();renderRelations();renderDecisions();renderReviews();renderDetail();
      document.querySelectorAll("[data-edge-mode]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.edgeMode===edgeMode)));
    }
    function select(kind,id){selected={kind,id};if(kind==="node"||kind==="edge")edgeMode="focus";render()}
    function applyZoom(){canvas.style.transform=`scale(${zoom})`;canvas.style.width=`${1120*zoom}px`;canvas.style.height=`${720*zoom}px`;status.textContent=`Zoom ${Math.round(zoom*100)}%`}
    function fitToView(){zoom=Math.max(.28,Math.min(1,(viewport.clientWidth-24)/1120,(viewport.clientHeight-24)/720));applyZoom();viewport.scrollTo({left:0,top:0})}
    function exportModel(){
      const payload={schemaVersion:model.meta.schemaVersion,modelVersion:model.meta.modelVersion,baseRevision:model.meta.baseRevision,exportedAt:new Date().toISOString(),model,personalDraft:teamState,viewState:{selected,edgeMode,zoom,activeLayers:[...activeLayers],searchTerm}};
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download=`${model.meta.title.toLowerCase().replace(/[^a-z0-9]+/g,"-")}.json`;link.hidden=true;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),0);status.textContent="Versioned map state exported.";
    }
    async function importModel(file){
      try{
        const payload=JSON.parse(await file.text());
        if(payload.schemaVersion!==model.meta.schemaVersion)throw new Error("Schema version mismatch");
        if(payload.modelVersion!==model.meta.modelVersion)throw new Error("Model version mismatch");
        if(payload.baseRevision!==model.meta.baseRevision)throw new Error("Base revision conflict. Compare maps before merging.");
        if(!payload.model||JSON.stringify(payload.model)!==JSON.stringify(model))throw new Error("Canonical model conflict. Merge the model outside the browser, then import its personal draft.");
        const incoming={...structuredClone(defaultState),...payload.personalDraft};
        const conflicts=[];const merged=structuredClone(teamState);
        for(const bucket of ["notes","priorities","decisionStatuses"]){
          const allowedIds=new Set((bucket==="decisionStatuses"?model.decisions:model.nodes).map(item=>item.id));
          for(const [key,value] of Object.entries(incoming[bucket]||{})){
            if(!allowedIds.has(key))throw new Error(`Unknown draft target: ${bucket}.${key}`);
            if(bucket==="decisionStatuses"&&value==="accepted"&&model.decisions.find(item=>item.id===key)?.status!=="accepted")throw new Error(`Acceptance requires a canonical model update: ${key}`);
            if(Object.hasOwn(merged[bucket],key)&&merged[bucket][key]!==value)conflicts.push(`${bucket}.${key}`);
            else merged[bucket][key]=value;
          }
        }
        if(conflicts.length)throw new Error(`Draft conflict in ${conflicts.join(", ")}`);
        const events=new Map();
        for(const event of merged.events||[]){const error=draftEventError(event);if(error)throw new Error(`Invalid saved event: ${error}`);events.set(event.eventId,event)}
        for(const event of incoming.events||[]){
          const error=draftEventError(event);if(error)throw new Error(`Invalid imported event: ${error}`);
          if(events.has(event.eventId)&&JSON.stringify(events.get(event.eventId))!==JSON.stringify(event))throw new Error(`Event conflict: ${event.eventId}`);
          events.set(event.eventId,event);
        }
        merged.events=[...events.values()];teamState=merged;savePersonalDraft();render();status.textContent="Personal draft imported and merged by event ID.";
      }catch(error){status.textContent=`Import blocked: ${error.message}`}
    }

    document.querySelector("[data-map-title]").textContent=model.meta.title;
    document.querySelector("[data-decision-question]").textContent=model.meta.decisionQuestion;
    document.addEventListener("click",event=>{

      const layer=event.target.closest("[data-layer]");if(layer){layer.checked?activeLayers.add(layer.dataset.layer):activeLayers.delete(layer.dataset.layer);render();return}
      const mode=event.target.closest("[data-edge-mode]");if(mode){edgeMode=mode.dataset.edgeMode;if(edgeMode==="overview")selected=null;render();return}
      const action=event.target.closest("[data-action]")?.dataset.action;
      if(action==="fit")fitToView();if(action==="zoom-in"){zoom=Math.min(1.6,zoom+.1);applyZoom()}if(action==="zoom-out"){zoom=Math.max(.4,zoom-.1);applyZoom()}if(action==="reset"){zoom=1;applyZoom()}
      if(action==="collapse-left"){shell.classList.toggle("left-collapsed");event.target.setAttribute("aria-expanded",String(!shell.classList.contains("left-collapsed")));fitToView()}
      if(action==="collapse-right"){shell.classList.toggle("right-collapsed");event.target.setAttribute("aria-expanded",String(!shell.classList.contains("right-collapsed")));fitToView()}
      if(action==="export")exportModel();if(action==="import")document.querySelector("[data-import-input]").click();
      if(action==="clear-state"&&window.confirm("Clear the personal draft saved in this browser?")){teamState=structuredClone(defaultState);try{localStorage.removeItem(storageKey)}catch(error){}render();status.textContent="Personal draft cleared."}
    });
    document.addEventListener("input",event=>{
      if(event.target.matches("[data-search]")){searchTerm=event.target.value.trim().toLowerCase();render()}
      if(event.target.matches("[data-edit-note]")&&selected?.kind==="node"){teamState.notes[selected.id]=event.target.value;appendEvent("note",selected.id,event.target.value)}
    });
    document.addEventListener("change",event=>{
      if(event.target.matches("[data-edit-priority]")&&selected?.kind==="node"){teamState.priorities[selected.id]=event.target.value;appendEvent("priority",selected.id,event.target.value);render()}
      if(event.target.matches("[data-edit-decision]")&&selected?.kind==="decision"){
        const decision=model.decisions.find(item=>item.id===selected.id);
        if(event.target.value==="accepted"&&decision.status!=="accepted"){status.textContent="Acceptance requires a versioned canonical model update.";render();return}
        teamState.decisionStatuses[selected.id]=event.target.value;appendEvent("decision-status",selected.id,event.target.value);render();
      }
      if(event.target.matches("[data-import-input]")&&event.target.files[0])importModel(event.target.files[0]);
    });
    window.addEventListener("resize",()=>fitToView());
    window.__decisionMap={model,get state(){return teamState},render,fitToView};
    render();requestAnimationFrame(fitToView);
  </script>
</body>
</html>
